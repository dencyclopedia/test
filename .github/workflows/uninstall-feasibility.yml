name: uninstall-feasibility
# Feasibility test for an uninstall-guide site: can GitHub runners give us real screenshots,
# screen recordings and measured leftover-file data for "how to uninstall X" on macOS and Windows?
on:
  push:
    branches: [claude/upbeat-volta-fdndl6]
    paths: ['.github/workflows/uninstall-feasibility.yml', 'uninstall-lab/scripts/**']
  workflow_dispatch:
permissions:
  contents: write
env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cask: vlc, app: VLC.app }
          - { cask: zoom, app: zoom.us.app }
    steps:
      - uses: actions/checkout@v4
      - run: bash uninstall-lab/scripts/mac_uninstall.sh "${{ matrix.cask }}" "${{ matrix.app }}" out/macos-${{ matrix.cask }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'u-macos-${{ matrix.cask }}', path: 'out/macos-${{ matrix.cask }}' }
  win:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: VideoLAN.VLC, name: VLC, slug: vlc }
          - { id: Zoom.Zoom, name: Zoom, slug: zoom }
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - run: ./uninstall-lab/scripts/win_uninstall.ps1 -id "${{ matrix.id }}" -name "${{ matrix.name }}" -out "$env:GITHUB_WORKSPACE\out\windows-${{ matrix.slug }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'u-windows-${{ matrix.slug }}', path: 'out/windows-${{ matrix.slug }}' }
  collect:
    needs: [mac, win]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'u-*', path: dl }
      - name: Commit
        run: |
          D=uninstall-lab/feasibility-2026-11-20; mkdir -p $D
          for d in dl/u-*; do n=${d#dl/u-}; rm -rf $D/$n; find $d -size +20M -print -delete; mv $d $D/$n; done
          echo "run: $RUN_URL" > $D/RUN.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $D; git commit -q -m "uninstall feasibility captures (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM%10+5)); done
