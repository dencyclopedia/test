name: install-macos
# macOS install captures: Homebrew (arm64 macos-latest; Intel labels attempted), tesseract-lang,
# Terminal.app screenshots, pytesseract error. MacPorts: see install-macports.yml.
on:
  push:
    branches: [claude/upbeat-volta-fdndl6]
    paths: ['.github/workflows/install-macos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brew:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, macos-13]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        run: |
          out=out/brew-${{ matrix.runner }}; mkdir -p $out
          bash install/macos/scripts/mac.sh $out
      - name: Commit results
        if: always()
        run: |
          d=install/macos/brew-${{ matrix.runner }}; rm -rf $d; mkdir -p install/macos; cp -R out/brew-${{ matrix.runner }} $d
          echo "run: $RUN_URL" > $d/RUN.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $d; git commit -q -m "macOS install captures: ${{ matrix.runner }} (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM%10+5)); done
